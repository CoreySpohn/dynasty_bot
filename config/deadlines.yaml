deadlines:
# =========================================================================
# OFF-SEASON DEADLINES
# =========================================================================

# Rule proposals open 2 weeks before Super Bowl
- id: rule_proposals_open
  name: Rule Proposals Open
  description: "🗳️ Rule proposals are now OPEN! Submit any rule changes you'd like the league to vote on. Proposals close 1 week after the Super Bowl."
  date: null
  relative_to: super_bowl
  offset_days: -14  # 2 weeks before Super Bowl
  reminders:
  - 0  # Same day announcement
  state: off_season
  enabled: true
  announce: true  # Post to announcements channel
  ping_role: true  # Ping @Active Owner

# Rule proposals deadline is 1 week after Super Bowl
- id: rule_proposals_deadline
  name: Rule Proposals Deadline
  description: "⏰ LAST CALL for rule proposals! All proposals must be submitted by end of day. Voting begins soon."
  date: null
  relative_to: super_bowl
  offset_days: 7  # 1 week after Super Bowl
  reminders:
  - 3
  - 1
  - 0
  state: off_season
  enabled: true
  announce: true
  ping_role: true

# Rule voting ends when March starts
- id: rule_voting_ends
  name: Rule Voting Ends
  description: "🗳️ Final day to cast votes on rule changes! Voting ends at midnight."
  date: '2026-03-01'
  recurring: yearly
  month: 3
  day: 1
  reminders:
  - 7
  - 1
  - 0
  state: off_season
  enabled: true
  announce: true
  ping_role: true

- id: reactivate_league
  name: Reactivate League on Sleeper
  description: Renew the league on Sleeper after the Super Bowl. Trades are frozen until this is done.
