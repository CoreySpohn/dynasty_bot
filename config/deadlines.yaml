- id: taxi_decisions
  name: Taxi Squad Decisions
  # What Sleeper's taxi settings on this league actually mean:
  #   taxi_deadline = 4    -> the start of the regular season. Sleeper DOES
  #                           lock taxi moves on that date.
  #   taxi_years = 3       -> the 3-season window, matching TAXI_MAX_SEASONS.
  #   taxi_allow_vets = 1  -> lets non-rookies sit on the taxi squad. This is
  #                           required to get a 3-year window at all; without
  #                           it players would have to be activated after
  #                           their first year. It is NOT a loophole.
  # So Sleeper enforces the *when* and the *how long*. What it cannot check is
  # the *who*: only players you took in that off-season's own rookie draft may
  # be added, no free-agent pickups. lib/taxi_rules.py holds that rule and
  # /taxiaudit + /taxieligible compute it - but note nothing runs them on a
  # schedule yet, so it still takes someone invoking the command.
  # The league deadline is a day earlier than Sleeper's, so a move made on
  # kickoff day after games began can't count.
  description: "🚕 Finalize your taxi squad by the day before NFL Week 1! Sleeper locks taxi moves at the regular-season start but can't check eligibility - only players you took in this off-season's rookie draft may be stashed. Run /taxieligible to see yours; /taxiaudit flags violations."
  date: null
  relative_to: nfl_regular_season_start
  offset_days: -1
  reminders:
  - 3
  - 1
  - 0
  state: pre_season
  enabled: true
  announce: true
  ping_role: true

# =========================================================================
# IN-SEASON DEADLINES
# =========================================================================

- id: trade_deadline
  name: Trade Deadline
  # Sleeper ties the deadline to the LAST GAME of the configured week, so
  # trading stays open through all of Week 12 and shuts the moment the final
  # Week 12 game ends. Hence the anchor is nfl_week_12_end, not week 12's start.
  description: "⏰ Trades close when the last Week 12 game ends, and stay closed until the league is renewed after the Super Bowl!"
  date: null
  relative_to: nfl_week_12_end
  offset_days: 0
  reminders:
  - 7
  - 3
  - 1
  - 0
  state: in_season
  enabled: true
  announce: true
  ping_role: true

- id: power_rankings_weekly
  name: Power Rankings Due
  description: "Commissioner must post power rankings before Thursday night or get ICED! 🧊"
  recurring: weekly_in_season
  day_of_week: thursday
  time: '18:00'
  reminders:
  - 0
  state: in_season
  enabled: true
  ping_commissioner: true

