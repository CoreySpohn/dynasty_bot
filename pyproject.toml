[project]
name = "dynasty-bot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "anthropic>=0.117.1",
    "discord-py>=2.6.4",
    "google-genai>=1.59.0",
    "matplotlib>=3.10.8",
    "nflreadpy>=0.0.8",
    "openai>=2.46.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "pytz>=2024.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["clients", "cogs", "lib"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
